services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: techradar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-techradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-techradar}
      POSTGRES_DB: ${POSTGRES_DB:-techradar}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-techradar} -d ${POSTGRES_DB:-techradar}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redpanda broker (ready for Phase 2 stream processing)
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.2
    container_name: techradar-redpanda
    restart: unless-stopped
    command:
      - redpanda start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --memory 1G
    ports:
      - "19092:19092"
      - "18081:18081"
      - "18082:18082"
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  # Redpanda Web UI
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.5.2
    container_name: techradar-redpanda-console
    restart: unless-stopped
    depends_on:
      - redpanda
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092

volumes:
  postgres_data:
    name: techradar_postgres_data
  redpanda_data:
    name: techradar_redpanda_data
